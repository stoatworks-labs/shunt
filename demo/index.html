  <body>
    <main id="demo">
      <noscript>
        <h1>Shunt</h1>
        <p>
          An FFGL source and a matching mask effect for Resolume. Shapes slide
          in from whichever edge you choose, stop a set distance in, bank up
          behind one another (overlapping, newest on top) and get drawn away off
          the far side. You can set the spacing in multiples of the shape's own
          thickness, or in absolute pixels for a pixel map.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://stoatworks-labs.com/software/shunt/">its project page</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/shunt/">Project page and downloads</a></li>
          <li><a href="https://stoatworks-labs.com/software/shunt/guide/">User guide</a></li>
          <li><a href="https://github.com/stoatworks-labs/shunt">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
